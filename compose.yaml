services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - images:/app/images
      - logs:/app/logs
      - ./users.json:/app/users.json

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - images:/images:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  images:
  logs: